name: Build Re-TUI DEX Fork APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build Fdroid Debug APK
        run: ./gradlew :app:assembleFdroidDebug --console=plain

      - name: Build Sample DEX Module
        run: |
          D8=$(find $ANDROID_HOME/build-tools -name d8 | sort -V | tail -n 1)
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name android.jar | sort -V | tail -n 1)
          echo "Using D8: $D8"
          echo "Using Android Jar: $ANDROID_JAR"
          
          # 1. Build CyberSample
          mkdir -p build/sample-module
          SAMPLE_CLASSES=$(find app/build -name "*CyberSampleModule*.class")
          $D8 --lib "$ANDROID_JAR" --output build/sample-module $SAMPLE_CLASSES
          mv build/sample-module/classes.dex build/sample-module/module.dex
          cat > build/sample-module/manifest.json << 'EOF'
          {
            "id": "cybersample",
            "title": "CYBER SAMPLE",
            "entryClass": "com.cyanoge1.sampledex.CyberSampleModule",
            "dexFile": "module.dex"
          }
          EOF
          cd build/sample-module && zip -r ../../cybersample-dex.zip * && cd ../..

          # 2. Build YtdlpNativeModule
          mkdir -p build/ytdlp-module
          YTDLP_CLASSES=$(find app/build -name "*YtdlpNativeModule*.class")
          $D8 --lib "$ANDROID_JAR" --output build/ytdlp-module $YTDLP_CLASSES
          mv build/ytdlp-module/classes.dex build/ytdlp-module/module.dex
          cat > build/ytdlp-module/manifest.json << 'EOF'
          {
            "id": "ytdlp",
            "title": "YT-DLP // NATIVE",
            "entryClass": "com.cyanoge1.sampledex.YtdlpNativeModule",
            "dexFile": "module.dex"
          }
          EOF
          cd build/ytdlp-module && zip -r ../../ytdlp-dex.zip * && cd ../..

      - uses: actions/upload-artifact@v4
        with:
          name: retui-dex-fork-apk
          path: app/build/outputs/apk/fdroid/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cybersample-dex
          path: cybersample-dex.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ytdlp-dex
          path: ytdlp-dex.zip
